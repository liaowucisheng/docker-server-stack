services:
  # =====================================
  # Gitea数据库初始化
  # 自动创建独立数据库和用户
  # =====================================
  gitea-db-init:
    container_name: gitea-db-init
    image: postgres:15-bookworm
    restart: "no"
    init: true

    environment:
      TZ: ${TZ}
      PGPASSWORD: ${POSTGRES_PASSWORD}

    networks:
      - backend_network

    # 注意：必须使用 literal 块（|）+ 列表形式传参。
    # 旧写法用折叠标量（>）配合行尾 "\" 续行，YAML 会把换行折叠成空格，
    # "\ " 退化成“转义空格”，psql 会收到 " -tc" 这样的错误参数，初始化静默失败。
    command:
      - sh
      - -c
      - |
        set -e

        echo 'Waiting PostgreSQL...'
        until pg_isready -h postgres -U "${POSTGRES_USER}"; do
            sleep 2
        done

        echo 'Creating Gitea database...'
        if ! psql -h postgres -U "${POSTGRES_USER}" -tAc \
            "SELECT 1 FROM pg_database WHERE datname='${GITEA_DB_NAME}'" | grep -q 1; then
            psql -h postgres -U "${POSTGRES_USER}" \
                -c "CREATE DATABASE \"${GITEA_DB_NAME}\""
        fi

        if ! psql -h postgres -U "${POSTGRES_USER}" -tAc \
            "SELECT 1 FROM pg_roles WHERE rolname='${GITEA_DB_USER}'" | grep -q 1; then
            psql -h postgres -U "${POSTGRES_USER}" \
                -c "CREATE USER \"${GITEA_DB_USER}\" PASSWORD '${GITEA_DB_PASSWORD}'"
        fi

        psql -h postgres -U "${POSTGRES_USER}" \
            -c "GRANT ALL PRIVILEGES ON DATABASE \"${GITEA_DB_NAME}\" TO \"${GITEA_DB_USER}\""

        # PostgreSQL 15 起 public schema 不再对 PUBLIC 默认授予 CREATE 权限，
        # 必须显式授权，否则 Gitea 迁移会报 permission denied for schema public
        psql -h postgres -U "${POSTGRES_USER}" -d "${GITEA_DB_NAME}" \
            -c "GRANT ALL ON SCHEMA public TO \"${GITEA_DB_USER}\""

        echo 'Gitea database ready'

    depends_on:
      postgres:
        condition: service_healthy

  # =====================================
  # Gitea Git代码托管服务
  # =====================================
  gitea:
    container_name: gitea
    image: gitea/gitea:1.27.0
    restart: unless-stopped

    init: true
    security_opt:
      - "no-new-privileges:true"

    environment:
      TZ: ${TZ}
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: ${GITEA_DB_NAME}
      GITEA__database__USER: ${GITEA_DB_USER}
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD}
      GITEA__server__DOMAIN: ${GITEA_DOMAIN}
      GITEA__server__ROOT_URL: https://${GITEA_DOMAIN}
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT}
      GITEA__server__SSH_LISTEN_PORT: 22
      GITEA__server__HTTP_PORT: 3000
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER}
      GITEA_ADMIN_PASSWD: ${GITEA_ADMIN_PASSWORD}
      GITEA_ADMIN_EMAIL: ${GITEA_ADMIN_EMAIL}

    ports:
      - "${GITEA_SSH_PORT}:22"

    volumes:
      - ../appdata/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    networks:
      - proxy_network
      - backend_network

    depends_on:
      gitea-db-init:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    stop_grace_period: 60s

    deploy:
      resources:
        limits:
          memory: 512M
